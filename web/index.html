<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f4f7fb;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      padding: 3rem;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dce3ec;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(31, 50, 81, 0.08);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    p {
      margin: 0;
      color: #536273;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}!</h1>
    <p>{{ .Message }}</p>
  </main>
</body>
</html>
